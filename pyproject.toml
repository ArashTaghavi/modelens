[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelens"
version = "0.1.0"
description = "Machine learning model analysis utilities"
requires-python = ">=3.10"

dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "scipy",
    "xgboost",
    "lightgbm",
    "catboost",
    'statsmodels'
]

[tool.setuptools.packages.find]
where = ["src"]
